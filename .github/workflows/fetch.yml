name: Fetch new birds

# Runs fetch.py on GitHub's servers and commits the new photos and CSV rows
# back to the same branch. Use it when Wikimedia rate-limits the machine you
# build on: push new rows in birds.csv or photos.csv to a branch named fetch/<anything>.
on:
  push:
    branches: ['fetch/**']
    paths: [birds.csv, photos.csv]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch photos and credits
        id: fetch
        continue-on-error: true
        run: |
          pip install -r requirements.txt
          python fetch.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add birds.csv photos.csv cache/images
          git diff --cached --quiet || git commit -m "Fetch photos for new birds"
          git push

      - name: Fail if any bird could not be fetched
        if: steps.fetch.outcome != 'success'
        run: exit 1
